[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondkey"
version = "0.1.0"
description = "The second key for every AI agent action: approve, snapshot and undo destructive commands."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Abhishek" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["ai-agents", "claude-code", "mcp", "safety", "change-control", "undo", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Abhishek-dev18/SecondKey"

[project.scripts]
secondkey = "secondkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secondkey = ["default_policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
